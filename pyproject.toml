[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvals"
version = "0.6.0"
license = "LicenseRef-DPCL-CE
license-files = ["LICENSE"]

description = "Open source AI evaluation, validation, benchmarking, recommendation engine and trust layer for LLMs"

readme = "README.md"

requires-python = ">=3.10"

authors = [
    { name = "Vishwanath Akuthota" }
]

keywords = [
    "AI evaluation",
    "LLM benchmarking",
    "model validation",
    "AI safety",
    "AI reliability",
    "LLM testing",
    "AI metrics",
    "machine learning evaluation",
    "AI benchmarking tools",
    "OpenAI evaluation",
    "Ollama benchmarking",
    "Claude evaluation",
    "Gemini AI testing",
    "Vishwanath Akuthota"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: AI Engineers, AIOps, Developers",
    "License :: Dr.Pinnacle Community Edition License (DPCL-CE)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: AI Qaulity Engineering"
]

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "typer",
    "rich",
    "pyyaml",
    "sentence-transformers",
    "matplotlib"
]

[project.optional-dependencies]
research = [
    "jupyterlab",
    "notebook",
    "plotly",
    "seaborn"
]

test = [
    "pytest>=8"
]

[project.urls]
Homepage = "https://github.com/vishwanathakuthota/openvals"
Documentation = "https://docs.openvalidations.com"
Source = "https://github.com/vishwanathakuthota/openvals"

[project.scripts]
openvals = "openvals.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openvals*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
openvals = [
    "datasets/**/*.json",
    "config/presets/*.yaml"
]